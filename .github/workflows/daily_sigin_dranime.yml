# .github/workflows/sign.yml
name: Daily Sign-in Dranime
on:
  schedule:
    #- cron: '0 19 * * *' # 每天 18:00 UTC (北京时间 02:00) 触发
    - cron: '0 */6 * * *' # 每天 18:00 UTC (北京时间 02:00) 触发
  workflow_dispatch:  # 支持手动触发

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Print TimeZone
        run: |
          echo "UTC time: $(date -u)"
          echo "Local runner time: $(date)"
          echo "GMT+8: $(TZ=Asia/Shanghai date)"
      - name: Sign in Dranime
        env:
          COOKIES: ${{ secrets.DRANIME_COOKIES }}
          FORMHASH: ${{ secrets.DRANIME_FORMHASH }}
        run: |
          #set -Eeuo pipefail

          # ========= Basic configuration =========
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 Safari/537.36"
          REFERER="https://www.dranime.net/dsu_paulsign-sign.html"
          CHECK_URL="https://www.dranime.net/dsu_paulsign-sign.html"
          SIGN_URL="https://www.dranime.net/plugin.php?id=dsu_paulsign:sign&operation=qiandao&infloat=1&inajax=1"

          # Send an HTTP request and append the HTTP status code
          request() {
              curl \
                  -s \
                  -L \
                  --max-time 30 \
                  --connect-timeout 10 \
                  --retry 3 \
                  --retry-delay 2 \
                  --retry-all-errors \
                  -w "\n%{http_code}" \
                  -H "User-Agent: $UA" \
                  -H "Referer: $REFERER" \
                  -b "$COOKIES" \
                  "$@"
          }

          # Candidate messages for today's sign-in
          sayings=("今天签到" "每日打卡" "我来啦" "加油！" "又是美好一天")

          # Randomly select a sign-in message
          random_index=$(( RANDOM % ${#sayings[@]} ))
          TODAYSAY="${sayings[$random_index]}"

          # ========= Check today's sign-in status =========
          echo "Checking today's sign-in status..."
          RESPONSE=$(request "$CHECK_URL")

          # Split the response into HTTP status code and response body
          HTTP_CODE="${RESPONSE##*$'\n'}"
          BODY="${RESPONSE%$'\n'*}"

          echo "HTTP status: ${HTTP_CODE}"
          echo "Response body: ${BODY}"
          echo "Response body: ${BODY}" | grep -B1 -A10 "您累计已签到"

          # Verify that the request completed successfully
          if [ "$HTTP_CODE" -ne 200 ]; then
              echo "❌ Failed to load sign-in page (HTTP $HTTP_CODE)"
              echo "Response body: ${BODY}"
              exit 1
          fi

          # Exit if the account has already signed in today
          if echo "$BODY" | grep -q "您今天已经签到过了或者签到时间还未开始"; then
              printf "\nℹ️ Already signed in today or sign-in is not available yet.\n"
              exit 0
          fi

          # ========= Submit today's sign-in =========
          echo "Submitting sign-in request..."
          RESPONSE=$(request "$SIGN_URL" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -H "Accept: */*" \
              -H "Accept-Language: zh-CN,zh;q=0.9" \
              --data-raw "formhash=${FORMHASH}&qdxq=ng&qdmode=1&todaysay=${TODAYSAY}&fastreply=0" \
              --compressed)

          # Split the response into HTTP status code and response body
          HTTP_CODE="${RESPONSE##*$'\n'}"
          BODY="${RESPONSE%$'\n'*}"

          echo "HTTP status: ${HTTP_CODE}"
          echo "Response body: ${BODY}"

          # Verify that the request completed successfully
          if [ "$HTTP_CODE" -ne 200 ]; then
              echo "❌ Network or server error (HTTP $HTTP_CODE)"
              exit 1
          fi

          # Check whether the sign-in was successful
          if [[ "$BODY" == *"签到成功"* ]]; then
              echo "✅ Sign-in completed successfully!"
              exit 0
          else
              echo "❌ Sign-in may have failed. Please check the response."
              exit 1
          fi